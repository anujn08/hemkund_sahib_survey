<text x="416" y="481" font-size="15">Dropdowns stay in the table; phone buttons are hidden here.</text>
<text x="394" y="551" font-size="16">A4.2 last-mile and A5 accommodation tables fit tablet widths.</text>
<text x="394" y="578" font-size="16">Phone layouts apply at screen widths of 600 pixels or less.</text>
<text x="38" y="625" font-size="14">Choice tasks keep three options side by side on phones, so you can compare them directly.</text>
</g></svg>