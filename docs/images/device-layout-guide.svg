<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Survey layouts on phones, tablets and desktops</title><desc id="desc">Illustrative layout: phone cards use colored shrine headers and selectable buttons; tablets and desktops use tables with dropdowns. The example values are not suggested responses.</desc>
<rect width="1200" height="650" rx="20" fill="#f0f5f8"/>
<g font-family="Arial, sans-serif" fill="#214357">
<text x="38" y="50" font-size="27" font-weight="700">Same questions, a layout for your screen</text>
<text x="38" y="80" font-size="16">Illustrations only. Select answers that match your own journey.</text>
