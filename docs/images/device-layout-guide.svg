<rect x="54" y="188" width="284" height="381" rx="12" fill="#f0f3f8" stroke="#4a5a7a"/>
<rect x="65" y="200" width="262" height="45" rx="8" fill="#4a5a7a"/>
<text x="81" y="229" font-size="18" font-weight="700" fill="white">Gangotri</text>
<text x="68" y="275" font-size="15" font-weight="700">Mode used / intended</text>
<rect x="68" y="288" width="124" height="43" rx="7" fill="#4a5a7a" stroke="#a9b6ca"/><text x="130.0" y="315" text-anchor="middle" font-size="14" fill="white">Trek / Walk</text>
<rect x="200" y="288" width="124" height="43" rx="7" fill="white" stroke="#a9b6ca"/><text x="262.0" y="315" text-anchor="middle" font-size="14" fill="#214357">Other</text>
<rect x="68" y="377" width="124" height="43" rx="7" fill="#4a5a7a" stroke="#a9b6ca"/><text x="130.0" y="404" text-anchor="middle" font-size="14" fill="white">Under 15 min</text>
<rect x="200" y="377" width="124" height="43" rx="7" fill="white" stroke="#a9b6ca"/><text x="262.0" y="404" text-anchor="middle" font-size="14" fill="#214357">15-30 min</text>
<rect x="68" y="429" width="124" height="43" rx="7" fill="white" stroke="#a9b6ca"/><text x="130.0" y="456" text-anchor="middle" font-size="14" fill="#214357">31-60 min</text>
<rect x="200" y="429" width="124" height="43" rx="7" fill="white" stroke="#a9b6ca"/><text x="262.0" y="456" text-anchor="middle" font-size="14" fill="#214357">1-2 hr</text>
