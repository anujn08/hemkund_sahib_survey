<rect x="961" y="271" width="164" height="49" rx="7" fill="#f7fafc" stroke="#bfd0df"/><text x="971" y="301" font-size="15">3-6 hr</text><path d="M1105,291 l5,5 l5,-5" fill="none" stroke="#214357" stroke-width="2"/>
